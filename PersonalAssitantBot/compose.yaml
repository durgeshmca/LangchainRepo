services:
  backend_fastapi:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
       - PG_CONNECTION:${PG_CONNECTION}
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5431:5432
volumes:
  db_data:
